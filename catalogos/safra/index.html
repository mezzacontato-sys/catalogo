<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madeiraria Safra - Catalogo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#fff;color:#111;-webkit-tap-highlight-color:transparent}
#header{background:#fff;padding:0 1.25rem;position:sticky;top:0;z-index:100}
#header-top{display:flex;align-items:center;justify-content:space-between;height:60px}
#logo-wrap{display:flex;align-items:center;gap:10px;max-width:65%}
#logo-img{max-height:44px;max-width:160px;object-fit:contain;display:none}
@media(min-width:640px){#logo-img{max-height:64px;max-width:220px}}
#logo-txt{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
#search-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;align-items:center;color:#111;flex-shrink:0}
#search-btn svg{width:20px;height:20px}
#search-bar{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease}
#search-bar.open{max-height:60px;padding-bottom:10px}
#search-wrap{position:relative}
#search{width:100%;padding:10px 36px 10px 14px;border:1.5px solid #111;font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:#111;outline:none}
#clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:20px;color:#999;display:none;line-height:1}
#clear-btn.show{display:block}
#suggestions{position:absolute;top:calc(100% + 2px);left:0;right:0;background:#fff;border:1.5px solid #111;border-top:none;z-index:200;display:none}
.sug-item{padding:10px 14px;font-size:13px;font-weight:500;cursor:pointer;color:#111;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.sug-item:last-child{border-bottom:none}
.sug-item:hover{background:#f5f5f5}
.sug-cat{font-size:11px;font-weight:400;color:#aaa;text-transform:uppercase;letter-spacing:.05em}
.sug-hi{text-decoration:underline;text-underline-offset:2px}
#filter-row{display:flex;align-items:center;overflow:hidden;border-bottom:1px solid #eee}
#filters{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;border-bottom:none}
#filters::-webkit-scrollbar{display:none}
#faq-rbar-btn{flex-shrink:0;margin-left:6px}
.chip{flex-shrink:0;padding:6px 14px;border:1.5px solid #ddd;border-radius:100px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#888;background:#fff;cursor:pointer;transition:all .18s}
.chip:hover{border-color:#111;color:#111}
.chip.active{background:#111;border-color:#111;color:#fff}
#subcats{display:none;gap:6px;flex-wrap:wrap;padding:0 1.25rem 10px;border-bottom:1px solid #eee}
.sub-chip{padding:5px 12px;border:1.5px solid #ddd;border-radius:100px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#999;background:#fff;cursor:pointer;transition:all .18s}
.sub-chip:hover{border-color:#555;color:#555}
.sub-chip.active{background:#111;border-color:#111;color:#fff}
#rbar{display:flex;align-items:center;justify-content:space-between;padding:8px 1.25rem;border-bottom:1px solid #eee;gap:8px}
#count{font-size:11px;font-weight:500;color:#aaa;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
#sort-sel{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#666;border:none;background:none;cursor:pointer;outline:none}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:#eee;padding-bottom:90px}
@media(min-width:900px){#grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){#grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;background:#fff;cursor:pointer;overflow:hidden;aspect-ratio:1/1;display:flex;flex-direction:column;opacity:0;transform:translateY(14px);transition:opacity .4s ease,transform .4s ease}
.card.visible{opacity:1;transform:translateY(0)}
.card-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem .75rem .5rem;overflow:hidden}
.card-img{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:transform .5s cubic-bezier(.25,.46,.45,.94)}
.card:hover .card-img{transform:scale(1.05)}
.card-info{padding:.45rem .75rem .65rem;background:#fff}
.card-sub-label{font-size:10px;font-weight:500;color:#aaa;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.card-title{font-size:12px;font-weight:700;color:#111;letter-spacing:.03em;text-transform:uppercase;line-height:1.3}
.card-add{position:absolute;bottom:52px;right:8px;width:30px;height:30px;border-radius:50%;background:#111;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s;z-index:2}
.card-add svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}
.card:hover .card-add{opacity:1;transform:scale(1)}
@media(hover:none){.card-add{opacity:1;transform:scale(1)}}
.card-add.added{background:#2a7a2a}
#cart-fab{position:fixed;bottom:24px;right:20px;z-index:200;display:none}
#cart-fab.show{display:block}
#cart-btn{width:56px;height:56px;border-radius:50%;background:#111;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.3);position:relative}
#cart-btn svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#cart-count{position:absolute;top:-4px;right:-4px;background:#c0392b;color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
#cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:none;align-items:flex-end;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#cart-overlay.open{display:flex}
#cart-drawer{background:#fff;width:100%;max-height:70vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);border-radius:16px 16px 0 0}
#cart-overlay.open #cart-drawer{transform:translateY(0)}
@media(min-width:640px){#cart-overlay{align-items:center;justify-content:center}#cart-drawer{width:420px;max-height:80vh;border-radius:8px;transform:scale(.96)}#cart-overlay.open #cart-drawer{transform:scale(1)}}
#cart-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff}
#cart-title{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
#cart-close{background:none;border:none;font-size:24px;cursor:pointer;color:#111;line-height:1}
#cart-items{padding:.5rem 0}
.cart-item{display:flex;align-items:center;gap:.85rem;padding:.75rem 1.25rem;border-bottom:1px solid #f0f0f0}
.cart-item-img{width:48px;height:48px;object-fit:contain;background:#f8f7f5;flex-shrink:0;border-radius:2px}
.cart-item-info{flex:1;min-width:0}
.cart-item-cat{font-size:10px;font-weight:500;color:#aaa;text-transform:uppercase;letter-spacing:.06em}
.cart-item-name{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.3;margin-top:1px}
.cart-item-remove{background:none;border:none;cursor:pointer;color:#ccc;font-size:20px;flex-shrink:0;padding:4px;line-height:1;transition:color .15s}
.cart-item-remove:hover{color:#c0392b}
#cart-empty-msg{padding:2.5rem;text-align:center;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#ccc}
#cart-footer{padding:1rem 1.25rem;position:sticky;bottom:0;background:#fff;border-top:1px solid #eee}
#cart-wpp-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:#25d366;color:#fff;border:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s}
#cart-wpp-btn:hover{background:#1ebe5d}
#cart-wpp-btn svg{width:20px;height:20px;fill:#fff;flex-shrink:0}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:flex-end;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#overlay.open{display:flex}
#modal{background:#fff;width:100%;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);border-radius:16px 16px 0 0}
#overlay.open #modal{transform:translateY(0)}
#modal-handle{width:36px;height:4px;border-radius:2px;background:#ddd;margin:10px auto 0;flex-shrink:0}
#modal-top{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.25rem;border-bottom:1px solid #eee;z-index:10}
#modal-cats{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#aaa}
#modal-close{background:none;border:none;font-size:26px;cursor:pointer;color:#111;line-height:1;padding:0}
#modal-img-wrap{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem 1rem;min-height:280px;position:relative}
#modal-img{max-height:300px;max-width:100%;object-fit:contain}
#modal-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5;pointer-events:none}
.mdot{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.7);padding:0;cursor:pointer;transition:background .18s,transform .18s;pointer-events:all;flex-shrink:0}
.mdot.on{background:#111;border-color:#111;transform:scale(1.25)}
#modal-prev,#modal-next{position:absolute;top:50%;transform:translateY(-60%);background:rgba(0,0,0,.18);color:#111;border:none;width:30px;height:30px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;font-weight:300}
#modal-prev{left:8px}#modal-next{right:8px}
#modal-body{padding:1.4rem 1.25rem 0}
#modal-name{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.35;margin-bottom:.85rem}
#modal-desc{font-size:14px;line-height:1.8;color:#555}
#modal-un{margin-top:.65rem;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#bbb}
#modal-actions{display:flex;flex-direction:column;gap:10px;margin:1.4rem 1.25rem 1.5rem}
#modal-add-cart{padding:15px;background:#fff;color:#111;border:1.5px solid #111;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
#modal-add-cart:hover{background:#111;color:#fff}
#modal-add-cart.added{background:#2a7a2a;border-color:#2a7a2a;color:#fff}
#modal-cta{display:block;padding:15px;background:#111;color:#fff;text-align:center;text-decoration:none;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;transition:opacity .2s}
#modal-cta:hover{opacity:.85}
#empty{display:none;text-align:center;padding:5rem 2rem}
#empty p{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ccc;margin-bottom:1.25rem}
#empty-reset{padding:12px 24px;background:#111;color:#fff;border:none;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}

/* ── BANNER ── */
#banner{
  background:#111;color:#fff;
  text-align:center;padding:9px 1rem;
  font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
}
#banner span{opacity:.6;margin:0 12px}


/* ── BADGE ── */
.badge{
  position:absolute;top:10px;left:10px;
  background:#111;color:#fff;
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 9px;z-index:3;
}
.badge.destaque{background:#b8860b;color:#fff}
.badge.promocao{background:#c0392b;color:#fff}

/* ── FAQ FAB ── */
#faq-fab{position:fixed;bottom:24px;left:20px;z-index:200}
#faq-btn{width:56px;height:56px;border-radius:50%;background:#111;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#faq-btn svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}

/* ── FAQ PÁGINA ── */
#faq-page{position:fixed;inset:0;z-index:500;background:#f7f7f5;overflow-y:auto;transform:translateX(100%);transition:transform .38s cubic-bezier(.4,0,.2,1)}
#faq-page.open{transform:translateX(0)}
#faq-page-header{position:sticky;top:0;background:#fff;z-index:10;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px;padding:0 1.25rem;height:60px}
#faq-back{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#111;padding:0;flex-shrink:0}
#faq-back svg{width:17px;height:17px;stroke:#111;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#faq-page-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#111}
#faq-page-intro{padding:1.4rem 1.1rem .8rem;font-size:12px;color:#999;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
#faq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 1.1rem 6rem}
@media(min-width:640px){#faq-grid{grid-template-columns:repeat(3,1fr);max-width:900px;margin:0 auto}}
.faq-card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:3/4;background:#222;-webkit-tap-highlight-color:transparent}
.faq-card-img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.25,.46,.45,.94);display:block}
.faq-card:hover .faq-card-img{transform:scale(1.06)}
.faq-card-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.18) 55%,transparent 100%)}
.faq-card-title{position:absolute;bottom:0;left:0;right:0;padding:.9rem .85rem;color:#fff;font-size:13px;font-weight:700;letter-spacing:.02em;line-height:1.3}

/* ── FAQ ARTICLE MODAL ── */
#faq-art-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:flex-end;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#faq-art-ov.open{display:flex}
#faq-art{background:#fff;width:100%;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);border-radius:16px 16px 0 0;display:flex;flex-direction:column}
#faq-art-ov.open #faq-art{transform:translateY(0)}
@media(min-width:640px){#faq-art-ov{align-items:center;justify-content:center}#faq-art{width:min(580px,92vw);max-height:82vh;border-radius:10px;transform:scale(.96)}#faq-art-ov.open #faq-art{transform:scale(1)}}
#faq-art-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:10px auto 6px;flex-shrink:0}
@media(min-width:640px){#faq-art-handle{display:none}}
#faq-art-cover{width:100%;height:200px;object-fit:cover;display:block;flex-shrink:0}
@media(min-width:640px){#faq-art-cover{height:240px}}
#faq-art-body{padding:1.4rem 1.25rem 0;flex:1}
#faq-art-footer{position:sticky;bottom:0;background:#fff;border-top:1px solid #eee;padding:.85rem 1.25rem;display:flex;justify-content:center;flex-shrink:0}
#faq-art-footer button{background:none;border:1.5px solid #ddd;border-radius:100px;padding:8px 28px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:#666;transition:all .18s}
#faq-art-footer button:hover{border-color:#111;color:#111}
#faq-art-close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.45);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;z-index:5}
#faq-art-top{position:relative}
#faq-art-title{font-size:18px;font-weight:700;letter-spacing:.01em;line-height:1.3;margin-bottom:1rem;color:#111}
#faq-art-content{font-size:14px;line-height:1.9;color:#444}
#faq-art-content p{margin-bottom:.75rem}
#faq-art-content h3{font-size:11px;font-weight:700;color:#111;letter-spacing:.08em;text-transform:uppercase;margin:1.3rem 0 .4rem;padding-bottom:.3rem;border-bottom:1.5px solid #eee}
#faq-art-content strong{color:#111;font-weight:700}
#faq-art-content em{color:#666;font-style:italic}
#faq-art-content ul{padding-left:1.2rem;margin:.5rem 0 1rem}
#faq-art-content li{margin-bottom:.55rem}
#faq-art-content br+br{display:block;margin-top:.4rem}

/* ── FULLSCREEN VIEWER ── */
#fs-ov{position:fixed;inset:0;background:#000;z-index:600;display:none;opacity:0;transition:opacity .22s ease}
#fs-ov.open{display:block}
#fs-ov.visible{opacity:1}
#fs-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#fs-img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-select:none;draggable:false}
#fs-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:none;color:#fff;font-size:26px;width:52px;height:52px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;line-height:1;transition:background .15s}
#fs-close:hover{background:rgba(255,255,255,.32)}
#fs-hint{position:absolute;bottom:52px;left:0;right:0;text-align:center;color:rgba(255,255,255,.45);font-size:11px;font-weight:500;letter-spacing:.08em;pointer-events:none;display:none}
#fs-dots-bar{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}
.fsdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.55);padding:0;cursor:pointer;transition:background .15s,transform .15s;pointer-events:all;flex-shrink:0}
.fsdot.on{background:#fff;border-color:#fff;transform:scale(1.25)}
/* Cursor e hint no modal */
#modal-img{cursor:zoom-in}
#modal-zoom-hint{position:absolute;bottom:42px;right:10px;background:rgba(0,0,0,.28);color:#fff;font-size:10px;font-weight:600;letter-spacing:.06em;padding:4px 8px;border-radius:20px;pointer-events:none;display:flex;align-items:center;gap:4px;opacity:.85}
#modal-zoom-hint svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ── DESKTOP MODAL (após estilos base para ter prioridade) ── */
@media(min-width:640px){
  #overlay{align-items:center;justify-content:center}
  #modal{width:min(1100px,92vw);height:85vh;max-height:85vh;border-radius:8px;transform:scale(.97);overflow:hidden;display:flex;flex-direction:column}
  #overlay.open #modal{transform:scale(1)}
  #modal-handle{display:none}
  #modal-top{position:relative}
  #modal-content{display:flex;flex:1;min-height:0}
  #modal-gallery{flex:1;border-right:1px solid #eee;display:flex;flex-direction:column;min-height:0;position:relative}
  #modal-img-wrap{flex:1;min-height:0;padding:0;overflow:hidden;position:relative}
  #modal-img{position:absolute!important;inset:1.5rem;width:calc(100% - 3rem)!important;height:calc(100% - 3rem)!important;max-height:none!important;max-width:none!important;object-fit:contain!important}
  #modal-detail{width:340px;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
  #modal-body{flex:1;padding:1.75rem 1.5rem 1rem}
  #modal-actions{padding:0 1.5rem 1.5rem;margin:0}
}
</style>
</head>
<body>
<div id="banner">Madeiraria Safra</div>
<div id="header">
  <div id="header-top">
    <div id="logo-wrap">
      <img id="logo-img" src="" alt="Logo">
      <span id="logo-txt">Madeiraria Safra</span>
    </div>
    <button id="search-btn" aria-label="Buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div id="search-bar"><div id="search-wrap">
    <input id="search" type="text" placeholder="Buscar produto..." autocomplete="off">
    <button id="clear-btn">&#215;</button>
    <div id="suggestions"></div>
  </div></div>
  <div id="filter-row">
    <div id="filters"></div>
    <button id="faq-rbar-btn" class="chip">&#63; Dúvidas</button>
  </div>
</div>
<div id="subcats"></div>

var SUBCATS = {};
for(var i=0;i<PRODUCTS.length;i++){
  var p=PRODUCTS[i];
  if(!SUBCATS[p.cat]) SUBCATS[p.cat]=[];
  if(p.sub && SUBCATS[p.cat].indexOf(p.sub)===-1) SUBCATS[p.cat].push(p.sub);
}

var cat="Todos", sub="", busca="", srt="az", cart=[];

// Aplica config
document.getElementById("logo-txt").textContent = NOME_EMPRESA;
document.title = NOME_EMPRESA + " - Catalogo";
if(LOGO_URL){
  document.getElementById("logo-img").src = LOGO_URL;
  document.getElementById("logo-img").style.display = "block";
  document.getElementById("logo-txt").style.display = "none";
}

function buildFilters(){
  var cats=["Todos"];
  for(var i=0;i<PRODUCTS.length;i++){
    if(cats.indexOf(PRODUCTS[i].cat)===-1) cats.push(PRODUCTS[i].cat);
  }
  var wrap=document.getElementById("filters");
  var h="";
  for(var i=0;i<cats.length;i++){
    h+='<button class="chip'+(cats[i]==="Todos"?" active":"")+'" data-cat="'+cats[i]+'">'+cats[i]+'</button>';
  }
  wrap.innerHTML=h;
  wrap.querySelectorAll(".chip").forEach(function(b){
    if(b.id==="faq-rbar-btn") return; // não é filtro de categoria
    b.addEventListener("click",function(){
      cat=b.dataset.cat; sub="";
      wrap.querySelectorAll(".chip").forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
      document.getElementById("search").value=""; busca="";
      document.getElementById("clear-btn").classList.remove("show");
      document.getElementById("suggestions").style.display="none";
      renderSubs(); render();
    });
  });
}

function isInCart(id){return cart.some(function(x){return x.id===id;});}
function addToCart(id){
  if(isInCart(id))return;
  var p=PRODUCTS.find(function(x){return x.id===id;});
  if(!p)return;
  cart.push(p); updateCartUI();
}
function removeFromCart(id){
  cart=cart.filter(function(x){return x.id!==id;});
  updateCartUI(); renderCartItems();
}
function updateCartUI(){
  var n=cart.length;
  document.getElementById("cart-count").textContent=n;
  document.getElementById("cart-fab").classList.toggle("show",n>0);
  document.querySelectorAll(".card-add").forEach(function(b){
    b.classList.toggle("added",isInCart(parseInt(b.dataset.id)));
  });
  var mid=document.getElementById("modal").dataset.pid;
  if(mid){
    var btn=document.getElementById("modal-add-cart");
    if(isInCart(parseInt(mid))){btn.textContent="Adicionado ao pedido";btn.classList.add("added");}
    else{btn.textContent="+ Adicionar ao pedido";btn.classList.remove("added");}
  }
}
function renderCartItems(){
  var el=document.getElementById("cart-items");
  if(!cart.length){el.innerHTML='<div id="cart-empty-msg">Nenhum item adicionado</div>';return;}
  var h="";
  for(var i=0;i<cart.length;i++){
    var p=cart[i];
    h+='<div class="cart-item">';
    h+='<img class="cart-item-img" src="'+p.foto+'" alt="'+p.nome+'">';
    h+='<div class="cart-item-info">';
    h+='<div class="cart-item-cat">'+p.cat+(p.sub?" - "+p.sub:"")+'</div>';
    h+='<div class="cart-item-name">'+p.nome+'</div>';
    h+='</div>';
    h+='<button class="cart-item-remove" data-id="'+p.id+'">&#215;</button>';
    h+='</div>';
  }
  el.innerHTML=h;
  el.querySelectorAll(".cart-item-remove").forEach(function(b){
    b.addEventListener("click",function(){removeFromCart(parseInt(b.dataset.id));});
  });
}
function sendCartWpp(){
  if(!cart.length)return;
  var msg="Ola!+Gostaria+de+solicitar+orcamento+dos+seguintes+itens:%0A%0A";
  for(var i=0;i<cart.length;i++){
    msg+=(i+1)+". "+cart[i].cat+" - "+cart[i].nome;
    if(i<cart.length-1)msg+="%0A";
  }
  msg+="%0A%0AAguardo+retorno,+obrigado!";
  window.open("https://wa.me/"+WHATSAPP+"?text="+msg,"_blank");
}
function filtered(){
  var r=PRODUCTS.filter(function(p){
    return(cat==="Todos"||p.cat===cat)&&(!sub||p.sub===sub)&&(!busca||p.nome.toLowerCase().indexOf(busca.toLowerCase())!==-1);
  });
  if(srt==="az")r.sort(function(a,b){return a.nome.localeCompare(b.nome);});
  else r.sort(function(a,b){return b.nome.localeCompare(a.nome);});
  return r;
}
function renderSubs(){
  var el=document.getElementById("subcats");
  var s=SUBCATS[cat]||[];
  if(!s.length){el.style.display="none";return;}
  el.style.display="flex";
  var h="";
  for(var i=0;i<s.length;i++){
    h+='<button class="sub-chip'+(sub===s[i]?" active":"")+'" data-s="'+s[i]+'">'+s[i]+'</button>';
  }
  el.innerHTML=h;
  el.querySelectorAll(".sub-chip").forEach(function(b){
    b.addEventListener("click",function(){sub=sub===b.dataset.s?"":b.dataset.s;renderSubs();render();});
  });
}
function render(){
  var r=filtered();
  var grid=document.getElementById("grid");
  var empty=document.getElementById("empty");
  document.getElementById("count").textContent=r.length+(r.length!==1?" produtos":" produto");
  if(!r.length){grid.innerHTML="";empty.style.display="block";return;}
  empty.style.display="none";
  var h="";
  for(var i=0;i<r.length;i++){
    var p=r[i]; var added=isInCart(p.id);
    h+='<div class="card" data-id="'+p.id+'">';
    if(MAIS_VENDIDOS.indexOf(p.id)!==-1) h+='<div class="badge destaque">Mais vendido</div>';
    else if(PROMOCOES.indexOf(p.id)!==-1) h+='<div class="badge promocao">Promocao</div>';
    h+='<div class="card-img-wrap"><img class="card-img" src="'+p.foto+'" alt="'+p.nome+'" loading="lazy"></div>';
    h+='<button class="card-add'+(added?" added":"")+'" data-id="'+p.id+'">';
    h+='<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    h+='</button>';
    h+='<div class="card-info"><div class="card-sub-label">'+(p.sub||p.cat)+'</div><div class="card-title">'+p.nome+'</div></div>';
    h+='</div>';
  }
  grid.innerHTML=h;
  grid.querySelectorAll(".card").forEach(function(c){
    c.addEventListener("click",function(){openModal(parseInt(c.dataset.id));});
    c.querySelector(".card-add").addEventListener("click",function(e){e.stopPropagation();addToCart(parseInt(c.dataset.id));});
  });
  requestAnimationFrame(function(){
    var cards=document.querySelectorAll(".card");
    for(var i=0;i<cards.length;i++){
      (function(card,delay){setTimeout(function(){card.classList.add("visible");},delay);})(cards[i],i*50);
    }
  });
}
function suggest(v){
  var box=document.getElementById("suggestions");
  if(!v){box.style.display="none";return;}
  var m=PRODUCTS.filter(function(p){return p.nome.toLowerCase().indexOf(v.toLowerCase())!==-1;}).slice(0,6);
  if(!m.length){box.style.display="none";return;}
  var h="";
  for(var i=0;i<m.length;i++){
    var p=m[i];
    var re=new RegExp("("+v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    var hi=p.nome.replace(re,'<span class="sug-hi">$1</span>');

// ── Swipe down para fechar modal (mobile) ─────────────────
(function(){
  var modal   = document.getElementById("modal");
  var overlay = document.getElementById("overlay");
  var startY=0, lastY=0, active=false;

  modal.addEventListener("touchstart",function(e){
    startY = lastY = e.touches[0].clientY;
    active = true;
    modal.style.transition = "none";
  },{passive:true});

  modal.addEventListener("touchmove",function(e){
    if(!active) return;
    lastY = e.touches[0].clientY;
    var delta = lastY - startY;
    // Só arrasta para baixo e só quando está no topo do scroll
    if(delta > 0 && modal.scrollTop <= 0){
      modal.style.transform = "translateY("+delta+"px)";
    }
  },{passive:true});

  modal.addEventListener("touchend",function(){
    if(!active) return;
    active = false;
    modal.style.transition = "";
    var delta = lastY - startY;
    if(delta > 90){
      closeModal();
      setTimeout(function(){ modal.style.transform=""; },400);
    } else {
      modal.style.transform = "";
    }
  });
})();

// ── FULLSCREEN VIEWER ─────────────────────────────────────
(function(){
  var fsOv    = document.getElementById("fs-ov");
  var fsWrap  = document.getElementById("fs-wrap");
  var fsImg   = document.getElementById("fs-img");
  var fsClose = document.getElementById("fs-close");
  var fsDBar  = document.getElementById("fs-dots-bar");
  var fsHint  = document.getElementById("fs-hint");
  var fsFotos = [], fsIdx = 0, fsScale = 1;

  // ── Mostrar hint "toque duplo" apenas no mobile na 1ª vez ──
  var hintShown = false;

  function updateFsDots(){
    fsDBar.querySelectorAll(".fsdot").forEach(function(d,i){
      d.classList.toggle("on", i===fsIdx);
    });
  }

  function fsSetFoto(idx){
    fsIdx = idx;
    fsImg.src = fsFotos[idx];
    // Preload vizinha
    if(fsFotos.length>1){ var pre=new Image(); pre.src=fsFotos[(idx+1)%fsFotos.length]; }
    updateFsDots();
    // Reset zoom ao trocar foto
    fsScale = 1;
    fsImg.style.transition = "none";
    fsImg.style.transform  = "";
    fsImg.style.left = fsImg.style.top = "";
  }

  window.openFullscreen = function(fotos, idx){
    fsFotos = fotos; fsIdx = idx;
    fsScale = 1;
    fsImg.style.transform = "";
    fsImg.style.transition = "";
    // Dots
    if(fotos.length>1){
      var h="";
      for(var i=0;i<fotos.length;i++)
        h+='<button class="fsdot'+(i===idx?" on":"")+'"></button>';
      fsDBar.innerHTML=h;
      fsDBar.querySelectorAll(".fsdot").forEach(function(d,i){
        d.addEventListener("click",function(e){ e.stopPropagation(); fsSetFoto(i); });
      });
    } else {
      fsDBar.innerHTML="";
    }
    fsImg.src = fotos[idx];
    // Preload todas
    fotos.forEach(function(s){ var i=new Image(); i.src=s; });
    // Hint apenas mobile e na 1ª abertura
    if(!hintShown && window.matchMedia("(hover:none)").matches){
      fsHint.style.display = "block";
      setTimeout(function(){ fsHint.style.display="none"; }, 2800);
      hintShown = true;
    }
    fsOv.style.display = "block";
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ fsOv.classList.add("visible"); });
    });
    // NÃO bloqueia overflow — modal já bloqueou
  };

  function fsCloseViewer(){
    fsOv.classList.remove("visible");
    fsOv.style.transition = "opacity .22s ease";
    setTimeout(function(){
      fsOv.style.display = "none";
      fsOv.style.transition = "";
      fsScale = 1;
      fsImg.style.transform = "";
      fsWrap.style.transform = "";
      fsWrap.style.transition = "";
    }, 220);
  }

  fsClose.addEventListener("click", function(e){ e.stopPropagation(); fsCloseViewer(); });

  // ── Duplo toque para zoom ──────────────────────────────
  var lastTap = 0;
  fsImg.addEventListener("touchend", function(e){
    if(e.changedTouches.length !== 1) return;
    var now = Date.now();
    if(now - lastTap < 320){
      e.preventDefault();
      if(fsScale === 1){
        fsScale = 2.4;
        fsImg.style.transition = "transform .28s cubic-bezier(.25,.46,.45,.94)";
        fsImg.style.transform  = "scale(2.4)";
      } else {
        fsScale = 1;
        fsImg.style.transition = "transform .25s cubic-bezier(.25,.46,.45,.94)";
        fsImg.style.transform  = "";
      }
      setTimeout(function(){ fsImg.style.transition=""; }, 300);
      lastTap = 0;
    } else {
      lastTap = now;
    }
  });

  // ── Swipe: fechar (baixo) + carrossel fluido (esquerda/direita) ──
  var swX=0, swY=0, swActive=false, swDir=null, swT=0;

  function _wrapTx(x, dur, ease){
    fsWrap.style.transition = dur ? "transform "+dur+"s "+(ease||"cubic-bezier(.25,.46,.45,.94)") : "none";
    fsWrap.style.transform  = x ? "translateX("+x+"px)" : "";
  }
  function _snapBack(){
    _wrapTx(0,.25); setTimeout(function(){fsWrap.style.transition="";},250);
  }
  function _slideTo(newIdx, dir){
    // dir: -1 = vai para esquerda (próxima), +1 = vai para direita (anterior)
    var vw = window.innerWidth;
    // 1. anima saída da imagem atual
    _wrapTx(dir * vw, .28);
    setTimeout(function(){
      // 2. troca foto e posiciona wrap no lado oposto (sem transição)
      fsSetFoto(newIdx);
      _wrapTx(-dir * vw, 0);
      // 3. anima entrada
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        _wrapTx(0, .28);
        setTimeout(function(){ fsWrap.style.transition=""; }, 280);
      });});
    }, 280);
  }

  fsOv.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1 || fsScale > 1){ swActive=false; return; }
    swX  = e.touches[0].clientX;
    swY  = e.touches[0].clientY;
    swT  = Date.now();
    swDir = null;
    swActive = true;
    fsWrap.style.transition = "none";
    fsOv.style.transition   = "none";
  },{passive:true});

  fsOv.addEventListener("touchmove", function(e){
    if(!swActive || e.touches.length !== 1 || fsScale > 1) return;
    var dx = e.touches[0].clientX - swX;
    var dy = e.touches[0].clientY - swY;

    // Determina direção no primeiro movimento significativo
    if(!swDir && (Math.abs(dx)>8 || Math.abs(dy)>8)){
      swDir = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
    }

    if(swDir === "h" && fsFotos.length > 1){
      // Foto segue o dedo
      fsWrap.style.transform = "translateX("+dx+"px)";
    } else if(swDir === "v" && dy > 0){
      var prog = Math.min(dy/280, 1);
      fsOv.style.transform = "translateY("+dy+"px)";
      fsOv.style.opacity   = ""+(1 - prog*0.6);
    }
  },{passive:true});

  fsOv.addEventListener("touchend", function(e){
    if(!swActive) return;
    swActive = false;
    var dx  = e.changedTouches[0].clientX - swX;
    var dy  = e.changedTouches[0].clientY - swY;
    var vel = Math.abs(dx) / (Date.now() - swT); // px/ms

    if(swDir === "h" && fsFotos.length > 1){
      // Threshold: 22% da tela OU flick rápido (>0.35 px/ms)
      if(Math.abs(dx) > window.innerWidth * 0.22 || vel > 0.35){
        _slideTo((fsIdx + (dx < 0 ? 1 : -1) + fsFotos.length) % fsFotos.length, dx < 0 ? -1 : 1);
      } else {
        _snapBack();
      }
    } else if(swDir === "v" && dy > 90){
      // Fechar com slide para baixo
      fsOv.style.transition = "transform .28s ease, opacity .28s ease";
      fsOv.style.transform  = "translateY(100vh)";
      fsOv.style.opacity    = "0";
      setTimeout(function(){
        fsOv.style.display    = "";
        fsOv.classList.remove("visible");
        fsOv.style.transform  = "";
        fsOv.style.opacity    = "";
        fsOv.style.transition = "";
        fsScale = 1;
        fsImg.style.transform = "";
        fsWrap.style.transform = "";
      }, 280);
    } else {
      // Snap back em qualquer direção
      if(swDir === "h"){ _snapBack(); }
      else {
        fsOv.style.transition = "transform .2s ease, opacity .2s ease";
        fsOv.style.transform  = ""; fsOv.style.opacity = "";
        setTimeout(function(){ fsOv.style.transition=""; }, 200);
      }
    }
  },{passive:true});

  // Click no fundo (desktop) fecha
  fsOv.addEventListener("click", function(e){
    if(e.target === fsOv || e.target === fsWrap){ fsCloseViewer(); }
  });
})();

// Clique na imagem do modal abre fullscreen
document.getElementById("modal-img").addEventListener("click", function(){
  openFullscreen(_mFotos, _mIdx);
});
